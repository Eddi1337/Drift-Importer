<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drift-Import{% block title %}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">D</span>
      <span>Drift-Import</span>
    </a>
    <nav>
      <a href="/" class="{{ 'on' if active=='dashboard.html' else '' }}">Overview</a>
      <a href="/import" class="{{ 'on' if active=='import.html' else '' }}">Import</a>
      <a href="/trips" class="{{ 'on' if active=='trips.html' else '' }}">Trips</a>
      <a href="/jobs" class="{{ 'on' if active=='jobs.html' else '' }}">Jobs</a>
      <details class="nav-more"><summary>More</summary><div>
        <a href="/library">Library</a><a href="/explorer">Explorer</a>
        <a href="/stats">System stats</a><a href="/destinations">Destinations</a><a href="/settings">Settings</a>
      </div></details>
    </nav>
    <span id="jobBadge" class="badge" title="active jobs"></span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast"></div>
  <script src="/static/app.js"></script>
  <script src="/static/workflow.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
