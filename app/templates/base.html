<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drift-Import{% block title %}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body class="page-{{ active|replace('.html', '') }}">
  <a href="#mainContent" class="skip-link">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">D</span>
      <span>Drift-Import</span>
    </a>
    <nav aria-label="Main navigation">
      <a href="/" class="{{ 'on' if active=='dashboard.html' else '' }}">Overview</a>
      <a href="/import" class="{{ 'on' if active=='import.html' else '' }}">Import</a>
      <a href="/trips" class="{{ 'on' if active=='trips.html' else '' }}">Trips</a>
      <a href="/jobs" class="{{ 'on' if active=='jobs.html' else '' }}">Jobs</a>
      <a href="/stats" class="{{ 'on' if active=='stats.html' else '' }}">Stats</a>
      <a href="/settings" class="{{ 'on' if active=='settings.html' else '' }}">Settings</a>
      <details class="nav-more"><summary>More</summary><div>
        <a href="/library">Library</a><a href="/explorer">Explorer</a>
        <a href="/destinations">Destinations</a>
      </div></details>
    </nav>
    <span id="jobBadge" class="badge" title="active jobs"></span>
  </header>
  <main id="mainContent" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js?v={{ asset_version }}"></script>
  <script src="/static/workflow.js?v={{ asset_version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
