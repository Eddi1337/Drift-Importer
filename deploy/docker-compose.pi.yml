# Compose file deployed to the Raspberry Pi. Pulls the prebuilt image from
# Harbor (no build on the Pi). Values come from the .env written next to it by
# deploy/deploy-to-pi.sh: HARBOR_REGISTRY and IMAGE_TAG.
services:
  drift-import:
    image: ${HARBOR_REGISTRY}/drift-import/drift-import:${IMAGE_TAG:-latest}
    container_name: drift-import
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1", "--no-access-log"]
    ports:
      - "8080:8080"
    environment:
      DRIFT_AUTH_USERNAME: admin
      DRIFT_AUTH_PASSWORD: ""          # set to enable login
      DRIFT_MAX_CONCURRENT_UPLOADS: "1"
      DRIFT_MAX_CONCURRENT_FFMPEG: "1"
      DRIFT_MOUNT_PATHS: "/media,/mnt"
      DRIFT_NAS_ROOT: "/mnt/NAS"
      DRIFT_REQUIRE_NAS_MOUNT: "true"
      DRIFT_WORKING_DIR: "/mnt/NAS/.drift/tmp"
      DRIFT_THUMBNAIL_DIR: "/mnt/NAS/.drift/thumbnails"
      DRIFT_SYSTEM_SAMPLE_INTERVAL_S: "300"
      DRIFT_UPLOAD_PROGRESS_INTERVAL_S: "30"
      DRIFT_JOB_PROGRESS_INTERVAL_S: "15"
      DRIFT_LOG_TO_FILE: "false"
      DRIFT_STATE_BACKUP_INTERVAL_S: "900"
    env_file:
      # Keep the live application's settings (including integrations) when
      # switching runtimes. This file remains on the Pi and is never copied to
      # CI or committed.
      - /opt/drift-import/.env
    volumes:
      # Preserve the existing systemd deployment's SQLite DB, key, logs and
      # generated clips across the Docker migration.
      - /var/lib/drift-import/data:/data
      - /var/lib/drift-import/working:/working
      # Camera (auto-mounted under /media) and any mounted NAS.
      - /media:/media:rslave
      - /mnt:/mnt:rslave
      # Host /proc so the stats page reports real network throughput: the NFS
      # upload runs in the host's net namespace, invisible in the container's.
      - /proc:/host/proc:ro
    # Pi Zero 2 W has ~425 MB RAM total; keep the container well under that.
    mem_limit: 256m
    cpus: 2.0
    cpu_shares: 256
    tmpfs:
      - /tmp:size=32m
    logging:
      driver: journald
      options:
        tag: drift-import
